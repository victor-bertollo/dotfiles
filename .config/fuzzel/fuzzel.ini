# ~/.config/fuzzel/fuzzel.ini
# Nord-тема, перенесена из rofi nord.rasi (undiabler)
# Палитра: nord0 #2e3440 ... nord10 #5e81ac, выделение nord7 #8fbcbb

[main]
font=Envy Code R:size=13
prompt=">   "
icons-enabled=yes
# terminal-приложения (.desktop с Terminal=true) запускать в alacritty:
terminal=alacritty -e
# раскладка списка (rofi был 2 колонки; fuzzel одноколоночный)
lines=10
width=40
horizontal-pad=18
vertical-pad=14
inner-pad=8
# dpi-aware НЕ ставим — fuzzel сам берёт scale от sway, иначе будет мыло/двойной скейл

[border]
width=2
radius=6

[colors]
# фон nord0 с лёгкой прозрачностью (как rgba(46,52,64,0.9) в rofi)
background=2e3440f0
# текст элементов — nord4
text=d8dee9ff
# подсказка (prompt) — nord9 (твой @foreground)
prompt=81a1c1ff
# введённый текст — nord6
input=eceff4ff
placeholder=4c566aff
# совпавшие символы поиска — nord8 (акцент)
match=88c0d0ff
# выделенная строка: фон nord7, текст nord0 (как element selected.normal)
selection=8fbcbbff
selection-text=2e3440ff
# совпавшие символы внутри выделения — nord10
selection-match=5e81acff
counter=4c566aff
# рамка — nord10
border=5e81acff
