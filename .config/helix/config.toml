theme = "nord"

[editor]
bufferline = "multiple"

[editor.file-picker]
hidden = false
git-ignore = false

[keys.normal]
C-h = ":buffer-previous"
C-l = ":buffer-next"

[keys.normal.space]
f = "file_picker_in_current_directory"
F = "file_picker"

[keys.select]
l ={l= ":pipe ~/.config/scripts/ll_helix.sh"}
